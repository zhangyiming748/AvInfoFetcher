name: fetch-av-info

on:
  # 手动触发，或 vid.csv 有变化（人工添加番号后推送）时触发
  push:
    paths:
      - vid.csv
  workflow_dispatch: {}

permissions:
  contents: write # 允许 workflow 提交并推送

concurrency:
  group: fetch-av-info
  cancel-in-progress: false # 避免多次运行同时写 vid.csv

jobs:
  fetch:
    runs-on: ubuntu-26.04
    # 本 workflow 回写 vid.csv 的自动提交带 [skip ci]，跳过以避免自我触发死循环
    # （GitHub 本身也识别 [skip ci]，这里再加一层显式判断兜底）
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    timeout-minutes: 30 # 兜底：网络挂起时避免任务一直耗到 6h 默认上限
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install translate-shell
        run: |
          sudo apt-get update
          sudo apt-get install -y translate-shell

      - name: Run fetcher
        env:
          AV_FETCH_COOKIE: ${{ secrets.AV_FETCH_COOKIE }}
        run: go run main.go

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain vid.csv)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vid.csv
            git commit -m "chore: update vid.csv [skip ci]"
            git push
          else
            echo "vid.csv 无变化，跳过提交"
          fi

      # 把本次抓取到的搜索页/详情页 HTML 上传为 artifact，便于事后排查
      # （比如遇到 Cloudflare 拦截时能看到实际返回的页面）
      - name: Upload fetched HTML artifacts
        if: always() # 即使前面步骤失败也上传，拦截/异常时恰恰最需要看
        uses: actions/upload-artifact@v7
        with:
          name: fetched-html-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
